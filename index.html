<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="index, follow" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

  <!-- Title -->
  <title>Rishabh Chaturvedi | Lead Engineer &amp; Applied AI Systems</title>

  <!-- SEO -->
  <meta name="description"
    content="Portfolio of Rishabh Chaturvedi — a Senior Software Engineer operating at lead scope across scalable backends, cloud platforms, search performance, and applied AI systems." />
  <meta name="keywords"
    content="Senior Software Engineer, Lead Engineer, Applied AI Systems, LLM Integration, Backend Architecture, Cloud Platforms, Ruby on Rails, Search Performance" />
  <meta name="author" content="Rishabh Chaturvedi" />

  <!-- Open Graph (LinkedIn, WhatsApp) -->
  <meta property="og:title" content="Rishabh Chaturvedi | Lead Engineer &amp; Applied AI Systems" />
  <meta property="og:description" content="Lead engineer building scalable cloud platforms and tool-grounded applied AI systems." />
  <meta property="og:site_name" content="Rishabh Chaturvedi Portfolio" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rishabhchaturvedi.dev/" />
  <meta property="og:image" content="https://rishabhchaturvedi.dev/og-card.png" />
  <meta property="og:image:secure_url" content="https://rishabhchaturvedi.dev/og-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Rishabh Chaturvedi portfolio preview showing engineering impact metrics" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rishabh Chaturvedi | Lead Engineer &amp; Applied AI Systems" />
  <meta name="twitter:description" content="Lead engineer building scalable cloud platforms and tool-grounded applied AI systems." />
  <meta name="twitter:image" content="https://rishabhchaturvedi.dev/og-card.png" />
  <meta name="twitter:image:alt" content="Rishabh Chaturvedi portfolio preview showing engineering impact metrics" />

  <!-- Editorial fonts; the portfolio shell uses the native system stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://rishabhchaturvedi.dev/" />

  <!-- Structured Data (JSON-LD) -->
  <script id="seo-structured-data" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://rishabhchaturvedi.dev/#person",
          "name": "Rishabh Chaturvedi",
          "url": "https://rishabhchaturvedi.dev/",
          "image": "https://rishabhchaturvedi.dev/og-card.png",
          "jobTitle": "Senior Software Engineer",
          "description": "Senior Software Engineer operating at lead scope across scalable backend systems, cloud platforms, search performance, and tool-grounded applied AI systems.",
          "knowsAbout": ["Applied AI Systems", "LLM Integration", "Ruby on Rails", "Django", "React", "Azure", "ElasticSearch", "PostgreSQL", "Kafka", "Cloud Migration"],
          "sameAs": [
            "https://linkedin.com/in/rishabhjchaturvedi",
            "https://github.com/RC-commit"
          ]
        }
      ]
    }
  </script>



</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
